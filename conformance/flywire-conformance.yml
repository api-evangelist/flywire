domain_standards:
  sector: payments / cross-border money movement
  note: >-
    Checked the contract and the documentation for a declared payments-domain
    standard — ISO 20022 message types, PSD2 / Open Banking (OBIE, Berlin Group,
    STET), FDX, EMV 3-D Secure conformance statements, X12/EDIFACT remittance,
    Nacha ACH formats, SEPA/BACS scheme identifiers, PCI card-present message
    shapes. Flywire's public APIs declare NONE of these: the request and response
    bodies are bespoke JSON with Flywire-defined field names, and the only
    standards visible in the contract are generic web ones (RFC 7807, OAuth 2.0,
    ISO 4217, ISO 3166 country codes). This is a REWARD-ONLY dimension and no
    conformance is invented to fill it.
  found: []
  partial:
  - id: sepa-bacs-direct-debit
    conforms: partial
    evidence: >-
      Flywire documents SEPA and BACS Direct Debit MANDATES as payment methods and
      publishes example test bank details for both (Change Log 2023-07-19), so it
      operates inside those schemes — but it does not expose scheme message types,
      mandate identifiers or scheme-conformant payloads through the API. An
      integrator gets a Flywire abstraction, not a scheme contract.
    source: https://solutions.flywire.com/en/testing/card-details
  - id: iso-3166
    conforms: true
    evidence: Country is expressed with ISO 3166 codes in payment and offer requests.
    source: https://developers.flywire.com/education/Content/api-basics.htm
