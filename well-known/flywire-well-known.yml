notes: >-
  Re-probed 2026-09-02 across ALL EIGHT Flywire hosts, including the four found
  this round on the Solutions documentation estate (api.flywire.com,
  invoicing.flywire.com, app.flywire.com, app.demo.flywire.com) and the docs host
  solutions.flywire.com. Result is unchanged and now much better evidenced: the
  RFC 9116 security.txt on www.flywire.com is the ONLY well-known document Flywire
  serves anywhere. There is no api-catalog, no ai-plugin.json, no agent card at
  either the current or the legacy path, and — notably, given that the Invoicing
  API is a real OAuth 2.0 client-credentials API with 16 documented scopes — no
  authorization-server metadata and no protected-resource metadata on any host, so
  those scopes and that token endpoint cannot be discovered by machine at all.
  solutions.flywire.com answers 500 (not 404) for every unrouted path, which is
  recorded as-is; it is a miss either way.
