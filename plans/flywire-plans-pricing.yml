notes: >-
  Flywire publishes NO public pricing for its payment platform or for API access.
  There is no /pricing page (https://www.flywire.com/pricing returns 404), no
  published rate card, no self-serve tier, and no plan selector anywhere on
  flywire.com, developers.flywire.com or solutions.flywire.com. Commercial terms
  are negotiated per client: the developer docs state plainly that "Registering
  an application is a manual process at the moment" and direct integrators to
  contact Flywire to be registered and issued an API Key and Shared Secret, and
  the refunds documentation repeatedly routes capability requests ("permission to
  work with refunds", refund cut-off times, netting/direct-debit collection) to
  the Flywire Solutions team. Payer-side FX margin and any fixed transaction fee
  are disclosed to the payer inside the checkout flow, not in a published catalog.
  This is an enterprise contact-sales model, recorded as plan_count 0 rather than
  omitted.
