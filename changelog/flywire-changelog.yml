gap_note: >-
  There is a 23-month gap between the 2024-08-15 entry and the 2026-08-19 entry.
  The developers.flywire.com Payments API documentation was independently stamped
  "last updated on August 19, 2026", so the two doc estates moved on the same day.
entries:
- date: '2026-08-19'
  title: Invoicing API Corrections
  breaking: false
  additions:
  - Documented the OAuth scopes and the company-scoping rule that govern every request
  - Documented sendEmailNotification on invoice create and the notification e-mail on credit note create
  - Documented Range semantics, page-size caps and sort syntax
  highlights:
  - Corrected the Invoicing API error responses — documented the real body shapes, the 403 status and the bodyless responses
  - Documented that searches and counts return 404 when nothing matches
  - Corrected the manual payment methods (BANK_TRANSFER, not BANK), the payment statuses and the payment search fields
  - Corrected credit note allocation semantics — a request REPLACES a credit note's allocations rather than adding to them
  - Corrected invoice update semantics, required and read-only body fields, late fee enums and service interval date format
