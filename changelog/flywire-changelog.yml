notes: >-
  Flywire keeps one dated change log, and it lives on the Solutions documentation
  site (solutions.flywire.com) — NOT on developers.flywire.com, which carries only
  a "This documentation was last updated on <date>" footer with no history. The log
  covers the Checkout, Payment Request, Dynamic Link, Invoicing and webhook
  surfaces. Entries are dated ISO-8601 and titled; they are NOT tied to an API
  version number, and the API itself is versioned only by URI path (v1). The log
  documents documentation changes and behaviour changes together, so a reader
  cannot always tell a doc correction from a contract change — the 2026-08-19
  entry, for example, is framed as "corrections" but changes the documented error
  bodies, statuses and OAuth scoping rules of the Invoicing API.
scheme: dated-entries
versioned: false
