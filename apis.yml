- name: Flywire Invoicing API
  description: >-
    REST API for the Flywire Invoicing Platform — contacts, invoices, credit
    notes and invoice payments for a company, with search, count and export on
    each resource. Authorized with OAuth 2.0 client credentials and enforced on
    two axes: the token must carry the scope for the resource and operation, and
    it must be scoped to the company named in the URL. Documented on Flywire's
    Solutions documentation estate, separately from the Payments API.
  humanURL: https://solutions.flywire.com/en/invoicing/invoicing-api
  baseURL: https://invoicing.flywire.com
