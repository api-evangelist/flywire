aid: flywire
name: Flywire
description: >-
  Flywire is a global payments enablement and software company that operates a
  proprietary cross-border payment network spanning more than 140 currencies and
  240 countries and territories, serving the education, healthcare, travel, and
  business-to-business verticals. The Flywire Payments API is an HTTP-based REST
  API (JSON request/response bodies, API-Key authorization) that lets platforms
  integrate Flywire's payment network directly — creating and capturing one-off,
  recurring, pre-authorization, refund, and 529 payments, managing payors,
  recipients, checkout sessions and documents, and receiving real-time payment
  status callbacks (webhooks) signed with an HMAC-SHA256 shared secret. Flywire
  also ships client-side JavaScript and React libraries (Flywire Elements,
  Checkout, Pay-By-Link) for embedding hosted payment experiences.
