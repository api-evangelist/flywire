- name: Flywire Payment Request API
  description: >-
    REST API for creating, retrieving, updating and removing payer-facing payment
    requests for a company, including instalment schedules. Requests are
    authenticated with an HMAC-SHA256 digest of the request body sent in the
    X-Flywire-Digest header rather than a bearer token, and the surface has its
    own invoice/payment-request webhook lifecycle.
  humanURL: https://solutions.flywire.com/en/payment-requests/payment-request-api
  baseURL: https://app.flywire.com/rest/payment-request/public/company/
