notes: >-
  Flywire ships NO server-side SDK in any language. Every first-party package it
  publishes is a browser/front-end or internal-tooling library; there is no
  Python, Java, Go, Ruby, PHP, .NET or Rust client for the Payments, Invoicing or
  Payment Request APIs. THE CURRENCY SIGNAL IS THE STORY HERE. Flywire's developer
  documentation was stamped "last updated on August 19, 2026" and its Invoicing
  API contract changed materially on the same date, but the newest release of any
  first-party npm package is @flywire/react-hooks (2024-11-25), and the two
  packages that actually wrap the payment surface — @flywire/flywire-js and
  @flywire/flywire-fetch — were last published on 2020-07-01 and 2020-06-30, more
  than six years before the API they front. TWO SEPARATE DEFECTS were confirmed on
  2026-09-02, both of which break a developer following the published metadata.
  (1) Every one of these packages declares a repository under
  github.com/peertransfer, and github.com/peertransfer is no longer Flywire: the
  handle was re-registered on 2026-05-14 by an unrelated account and holds ZERO
  public repositories. Flywire's real GitHub organization is
  github.com/flywirecorp (created 2010-11-17, 69 public repos, homepage
  flywire.com), which is where github.com/peertransfer/flystyles now redirects.
  (2) Three of the four declared repos — flywire-js, react-flywire-js and
  flywire-fetch — return 404 under BOTH handles: the source for Flywire's own
  payment libraries is not published anywhere on GitHub any more. The npm tarballs
  remain installable; their source does not.
