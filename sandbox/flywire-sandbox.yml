magic_values:
  field: cardholder name (first + last)
  description: >-
    The cardholder name entered in the sandbox determines the 3DS behaviour,
    success/failure, and resulting payment status flow.
  values:
  - first_name: MAGICVALUE
    last_name: AUTH
    triggers_3ds: true
    success: true
    status_flow: Initiated -> Processed -> Guaranteed
  - first_name: MAGICVALUE
    last_name: APPROVED
    triggers_3ds: false
    success: true
    status_flow: Initiated -> Processed -> Guaranteed
  - first_name: PAYMENT
    last_name: DELIVERED
    triggers_3ds: false
    success: true
    status_flow: Initiated -> Processed -> Guaranteed -> Delivered
  - first_name: MAGICVALUE
    last_name: EXPIRED
    triggers_3ds: false
    success: false
    status_flow: Initiated -> Failed
  - first_name: MAGICVALUE
    last_name: FRAUD
    triggers_3ds: false
    success: false
    status_flow: Initiated -> Failed
  - first_name: MAGICVALUE
    last_name: "NOT ENOUGH BALANCE"
    triggers_3ds: false
    success: false
    status_flow: Initiated -> Failed
threeds:
  password: password
  note: For scenarios that trigger 3DS, enter "password" in the password field to complete authentication.
