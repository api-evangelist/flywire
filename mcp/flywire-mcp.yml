invoicing_tool_groups:
  note: >-
    The Invoicing API's 25 documented operations are grouped rather than listed
    one-by-one here because every one of them is scope-gated AND company-gated,
    so a tool built on it must carry the scope in its own contract. See
    scopes/flywire-scopes.yml for the scope each group requires.
  groups:
  - group: contacts
    operations: 7
    scopes: [invoicing.contact.read, invoicing.contact.write]
    paths: ['POST/GET/PUT/PATCH/DELETE /company/:reference/contact[/:id|/:ids]', 'HEAD /company/:reference/contact']
  - group: invoices
    operations: 9
    scopes: [invoicing.invoice.read, invoicing.invoice.write, invoicing.payments.write]
    paths: ['POST/GET/PUT/PATCH/DELETE /company/:reference/invoice[/:id|/:ids]', 'GET /company/:reference/invoice/counts', 'GET /invoice/public/:publicId', 'POST /company/:reference/invoice/:id/payment/payex']
  - group: credit_notes
    operations: 7
    scopes: [invoicing.creditnote.read, invoicing.creditnote.write]
    paths: ['POST/GET/PUT/PATCH /company/:reference/creditnote[/:id|/:ids]', 'GET /creditnote/public/:publicId', 'POST /company/:reference/creditnote/:id/allocate']
  - group: company
    operations: 1
    scopes: [invoicing.company.read]
    paths: ['GET /company/:reference/settings/payNowCodes']
crosswalk:
  emitted: false
  reason: >-
    A ToolCrosswalk binds MCP tools to backing OpenAPI operationIds. Flywire
    publishes no OpenAPI and no GraphQL surface, and ships no MCP server, so there
    is nothing on either side of the crosswalk to bind. Not emitted rather than
    fabricated.
