notes: >-
  NO OFFICIAL FLYWIRE MCP SERVER EXISTS. Searched 2026-09-02: the Model Context
  Protocol registry (registry.modelcontextprotocol.io) returns zero servers for
  "flywire"; npm has no @flywire MCP package; neither developers.flywire.com nor
  solutions.flywire.com mentions MCP anywhere. The one apparent hit is a false
  positive worth recording so a later round does not chase it — a POST of
  tools/list to https://mcp.flywire.com/mcp returns 301 to
  https://www.flywire.com/pay/mcp/mcp, which is a wildcard-subdomain rewrite that
  ends in 404, not an MCP endpoint. This file is therefore a CANDIDATE tool
  surface derived from Flywire's own documented HTTP operations across all three
  of its public APIs, to seed a future server. Flywire publishes no OpenAPI, so
  every source_operation below points at the documentation page that states it,
  and no inputSchema is asserted — the parameters would have to come from an
  OpenAPI Flywire does not ship.
